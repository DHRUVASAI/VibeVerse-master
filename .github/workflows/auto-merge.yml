name: Auto Merge PR
on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only merge achievement branches
    if: startsWith(github.head_ref, 'achievement/')
    steps:
      - name: Merge PR
        run: gh pr merge "${{ github.event.pull_request.number }}" --merge --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
